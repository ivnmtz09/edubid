<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .fav-coin { stroke: #64748b; }
    .fav-cap { fill: #0f172a; }
    .fav-cap-line { stroke: #475569; }
    .fav-base { stroke: #64748b; }
    .fav-gavel { fill: #0f172a; }
    .fav-handle { stroke: #475569; }

    @media (prefers-color-scheme: dark) {
      .fav-coin { stroke: #94a3b8; }
      .fav-cap { fill: #f8fafc; }
      .fav-cap-line { stroke: #cbd5e1; }
      .fav-base { stroke: #94a3b8; }
      .fav-gavel { fill: #f8fafc; }
      .fav-handle { stroke: #cbd5e1; }
    }
  </style>
  <!-- Moneda EduCoin: Contorno circular sutil -->
  <circle class="fav-coin" cx="32" cy="32" r="23" fill="none" stroke-width="2" stroke-dasharray="3 2"/>

  <!-- Birrete Académico -->
  <polygon class="fav-cap" points="32,15 17,22 32,29 47,22"/>
  <path class="fav-cap-line" d="M 23 25.5 L 23 29 Q 32 34 41 29 L 41 25.5" fill="none" stroke-width="2"/>
  <!-- Borla naranja acento -->
  <circle cx="45" cy="28" r="2.5" fill="#ea580c"/>

  <!-- Mazo de Subasta Minimalista -->
  <line class="fav-base" x1="20" y1="48" x2="44" y2="48" stroke-width="2.5" stroke-linecap="round"/>
  <rect class="fav-gavel" x="23" y="33" width="18" height="6" rx="2"/>
  <rect x="30.5" y="33" width="3" height="6" fill="#ea580c"/>
  <line class="fav-handle" x1="32" y1="39" x2="32" y2="45" stroke-width="3" stroke-linecap="round"/>
</svg>
